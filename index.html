<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpoTest — Expediente de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF8F2;
    --paper-raised: #FFFFFF;
    --ink: #1C2B39;
    --ink-soft: #56636D;
    --line: #D6D0C0;
    --line-strong: #9AA5AC;
    --navy: #1C3A54;
    --navy-deep: #122636;
    --red: #A6303F;
    --red-soft: #F4E4E3;
    --green: #2F6F4E;
    --green-soft: #E4EFE6;
    --amber: #A9762B;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14201C;
      --paper-raised: #1B2A25;
      --ink: #EDE8DC;
      --ink-soft: #A9B3AC;
      --line: #34423C;
      --line-strong: #4A5A52;
      --navy: #6E9BC2;
      --navy-deep: #DCE7EE;
      --red: #E08A8F;
      --red-soft: #3A2323;
      --green: #8FCBA6;
      --green-soft: #223328;
      --amber: #D9B26A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14201C;
    --paper-raised: #1B2A25;
    --ink: #EDE8DC;
    --ink-soft: #A9B3AC;
    --line: #34423C;
    --line-strong: #4A5A52;
    --navy: #6E9BC2;
    --navy-deep: #DCE7EE;
    --red: #E08A8F;
    --red-soft: #3A2323;
    --green: #8FCBA6;
    --green-soft: #223328;
    --amber: #D9B26A;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    font-size: 15.5px;
    line-height: 1.5;
  }
  h1, h2, h3, .serif { font-family: "Source Serif 4", Georgia, serif; }

  /* ---- top bar, styled like a case-file header ---- */
  .topbar {
    padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px;
    border-bottom: 2px solid var(--navy);
    background: var(--paper-raised);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--navy-deep);
  }
  .topbar .brand small {
    display: block;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .file-ref {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 3px 8px;
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100% - 70px);
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
  }

  /* ---- sidebar: folder tabs ---- */
  .sidebar {
    border-right: 1px solid var(--line);
    padding: 18px 0;
  }
  .sidebar-label {
    padding: 0 18px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .tema-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 10px 18px;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
  }
  .tema-item:hover { background: var(--paper); }
  .tema-item.active {
    border-left-color: var(--red);
    background: var(--paper);
    font-weight: 600;
  }
  .tema-item .meta {
    display: block;
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 400;
    margin-top: 2px;
  }
  .add-tema-btn {
    margin: 12px 18px 0;
    width: calc(100% - 36px);
    padding: 9px 10px;
    border: 1px dashed var(--line-strong);
    background: none;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .add-tema-btn:hover { border-color: var(--navy); color: var(--navy); }
  .bloque-label {
    padding: 14px 18px 4px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .tema-item.sin-contenido { color: var(--ink-soft); font-style: italic; }
  .choice-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .choice-btn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13.5px;
    padding: 8px 14px;
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .choice-btn:hover { border-color: var(--navy); }
  .choice-btn.active { border-color: var(--navy); background: var(--navy); color: var(--paper-raised); font-weight: 600; }
  .num-input { max-width: 120px; }
  .review-item { border-bottom: 1px solid var(--line); padding: 12px 0; font-size: 13.5px; }
  .review-item .rq { font-weight: 600; margin-bottom: 4px; }
  .review-item .ra { color: var(--ink-soft); }
  .review-item .ra.wrong { color: var(--red); }
  .review-item .ra.right { color: var(--green); }

  main { padding: 26px 24px 60px; max-width: 720px; }

  /* ---- shared bits ---- */
  .btn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: var(--paper-raised);
    cursor: pointer;
  }
  .btn:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: none; color: var(--navy); }
  .btn.secondary:hover { background: var(--paper); }
  .btn.danger { background: none; color: var(--red); border-color: var(--red); }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--ink);
  }
  textarea { min-height: 160px; resize: vertical; }
  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .field:first-child label { margin-top: 0; }

  .empty {
    border: 1px dashed var(--line-strong);
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
  }

  .progress-bar { height: 6px; background: var(--line); width: 100%; margin-top: 6px; }
  .progress-bar > div { height: 100%; background: var(--green); }

  .stats-row { display: flex; gap: 22px; margin: 16px 0 22px; flex-wrap: wrap; }
  .stat { }
  .stat .num { font-family: "Source Serif 4", serif; font-size: 26px; font-weight: 600; }
  .stat .lbl { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }

  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  /* ---- exam card ---- */
  .exam-card {
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    padding: 22px 22px 18px;
    position: relative;
  }
  .exam-card::before {
    content: "";
    position: absolute; top: 10px; left: 10px; width: 10px; height: 10px;
    border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong);
  }
  .exam-card::after {
    content: "";
    position: absolute; bottom: 10px; right: 10px; width: 10px; height: 10px;
    border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong);
  }
  .q-number {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .q-text {
    font-family: "Source Serif 4", serif;
    font-size: 19px;
    line-height: 1.4;
    margin: 6px 0 20px;
  }
  .option {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 11px 12px;
    border: 1px solid var(--line);
    margin-bottom: 8px;
    cursor: pointer;
    background: var(--paper-raised);
  }
  .option:hover { border-color: var(--navy); }
  .option .letter {
    flex: none;
    width: 22px; height: 22px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .option.correct { border-color: var(--green); background: var(--green-soft); }
  .option.correct .letter { border-color: var(--green); color: var(--green); background: var(--paper-raised); }
  .option.incorrect { border-color: var(--red); background: var(--red-soft); }
  .option.incorrect .letter { border-color: var(--red); color: var(--red); background: var(--paper-raised); }
  .option.disabled { cursor: default; }
  .option.dim { opacity: 0.55; }

  .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .quiz-progress { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); }

  .banner {
    border-left: 3px solid var(--amber);
    background: var(--paper-raised);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .banner.error { border-left-color: var(--red); }

  .weak-list { margin-top: 8px; }
  .weak-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .weak-item .box-tag { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-soft); }

  .spinner-text { color: var(--ink-soft); font-size: 13.5px; }

  /* ---- tabs ---- */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 20px;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 14px 9px;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--navy-deep); border-bottom-color: var(--red); }

  /* ---- estadisticas ---- */
  .chart-card {
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    padding: 18px 20px 14px;
    margin-top: 18px;
  }
  .chart-card h3 { margin: 0 0 4px; font-size: 15px; }
  .chart-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .chart-card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-grid-line { stroke: var(--line); stroke-width: 1; }
  .chart-axis-label { fill: var(--ink-soft); font-family: "IBM Plex Mono", monospace; font-size: 9.5px; }
  .chart-value-label { fill: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; }
  .chart-bar-label { fill: var(--ink); font-family: "IBM Plex Sans", sans-serif; font-size: 11.5px; }

  .historial-list { margin-top: 8px; }
  .historial-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .historial-item .hi-main { color: var(--ink); }
  .historial-item .hi-meta { color: var(--ink-soft); font-size: 11.5px; margin-top: 2px; }
  .historial-item .hi-score { font-family: "IBM Plex Mono", monospace; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">OpoTest <small>Preparación de oposición · banco de preguntas propio</small></div>
  <div class="file-ref" id="file-ref">EXPEDIENTE — cargando…</div>
</div>

<div class="tabs">
  <button class="tab-btn" id="tab-examen">Examen</button>
  <button class="tab-btn" id="tab-estadisticas">Estadísticas</button>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-label">Temario</div>
    <div id="tema-list"></div>
    <button class="add-tema-btn" id="btn-refresh-temario">↻ Actualizar temario</button>
  </div>
  <main id="main"></main>
</div>

<script src="app.js"></script>
</body>
</html>
